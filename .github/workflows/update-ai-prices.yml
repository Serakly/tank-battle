name: 每日更新 AI 价格数据

on:
  schedule:
    - cron: "30 16 * * *" # 每天 UTC 16:30 = 北京时间 00:30
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 运行更新脚本
        run: python ai-price-hub/scripts/update_data.py

      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-price-hub/data/prices.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(ai-price-hub): 更新价格数据 $(date -u +%F)"
            git push
          else
            echo "数据无变化，跳过提交"
          fi
